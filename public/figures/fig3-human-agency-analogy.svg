<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Hand-drawn diagram: human cognition mapped one-to-one onto an LLM harness. Sensory input to input tokens. Stream of consciousness to reasoning / inner monologue. Grounded action to tool-grounded output.">
  <title>human agency analogy: three levels, two substrates</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;family=Newsreader:ital,wght@0,400;1,400&amp;display=swap');
    :root {
      --bg: #FAF7F0;
      --fg: #1a1814;
      --muted: #7a7368;
      --accent: #0F4C81;
      --accent-fill: rgba(15, 76, 129, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a15;
        --fg: #eae6db;
        --muted: #8a8276;
        --accent: #6ba3d6;
        --accent-fill: rgba(107, 163, 214, 0.14);
      }
    }
    .bg { fill: var(--bg); }
    .ink {
      fill: none;
      stroke: var(--fg);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ink-accent {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ink-dashed-muted {
      fill: none;
      stroke: var(--muted);
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 7 7;
    }
    .accent-fill { fill: var(--accent-fill); stroke: none; }
    .dot { fill: var(--fg); stroke: none; }
    .title-hand {
      font-family: 'Caveat', 'Comic Sans MS', 'Bradley Hand', cursive;
      font-weight: 700;
      fill: var(--fg);
      text-anchor: middle;
    }
    .title-hand-accent {
      font-family: 'Caveat', 'Comic Sans MS', 'Bradley Hand', cursive;
      font-weight: 700;
      fill: var(--accent);
      text-anchor: middle;
    }
    .label-hand {
      font-family: 'Caveat', 'Comic Sans MS', 'Bradley Hand', cursive;
      font-weight: 600;
      fill: var(--fg);
      text-anchor: middle;
    }
    .caption-serif {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      fill: var(--muted);
      text-anchor: middle;
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="675"/>

  <!-- Column headers -->
  <text class="title-hand" x="280" y="88" font-size="56">human</text>
  <text class="title-hand-accent" x="920" y="88" font-size="56">harness</text>
  <!-- underline flourish under each header -->
  <path class="ink" d="M 218 104 Q 280 108 342 103"/>
  <path class="ink-accent" d="M 848 104 Q 920 108 992 103"/>

  <!-- ========= LEFT COLUMN (human) =========
       Box dimensions: w ~360, h ~96. centre x = 280.
       Row centres y = 175, 350, 525 -->

  <!-- Row 1: sensory input -->
  <path class="ink" d="M 102 130 Q 280 127 458 132 Q 461 175 457 221 Q 280 224 103 220 Q 102 175 102 130 Z"/>
  <text class="label-hand" x="280" y="185" font-size="40">sensory input</text>

  <!-- Row 2: stream of consciousness -->
  <path class="ink" d="M 102 305 Q 280 302 458 307 Q 461 350 457 396 Q 280 399 103 395 Q 102 350 102 305 Z"/>
  <text class="label-hand" x="280" y="360" font-size="40">stream of consciousness</text>

  <!-- Row 3: grounded action -->
  <path class="ink" d="M 102 480 Q 280 477 458 482 Q 461 525 457 571 Q 280 574 103 570 Q 102 525 102 480 Z"/>
  <text class="label-hand" x="280" y="535" font-size="40">grounded action</text>

  <!-- Left column vertical arrows (between rows) -->
  <path class="ink" d="M 280 223 Q 278 250 281 302"/>
  <path class="ink" d="M 281 302 L 272 289"/>
  <path class="ink" d="M 281 302 L 290 289"/>

  <path class="ink" d="M 280 398 Q 278 425 281 477"/>
  <path class="ink" d="M 281 477 L 272 464"/>
  <path class="ink" d="M 281 477 L 290 464"/>

  <!-- ========= RIGHT COLUMN (harness, accent-filled) =========
       centre x = 920, same row centres -->

  <!-- Row 1: input tokens -->
  <path class="accent-fill" d="M 742 130 Q 920 127 1098 132 Q 1101 175 1097 221 Q 920 224 743 220 Q 742 175 742 130 Z"/>
  <path class="ink-accent" d="M 742 130 Q 920 127 1098 132 Q 1101 175 1097 221 Q 920 224 743 220 Q 742 175 742 130 Z"/>
  <text class="label-hand" x="920" y="185" font-size="40">input tokens</text>

  <!-- Row 2: reasoning / inner monologue -->
  <path class="accent-fill" d="M 742 305 Q 920 302 1098 307 Q 1101 350 1097 396 Q 920 399 743 395 Q 742 350 742 305 Z"/>
  <path class="ink-accent" d="M 742 305 Q 920 302 1098 307 Q 1101 350 1097 396 Q 920 399 743 395 Q 742 350 742 305 Z"/>
  <text class="label-hand" x="920" y="342" font-size="36">reasoning /</text>
  <text class="label-hand" x="920" y="380" font-size="36">inner monologue</text>

  <!-- Row 3: tool-grounded output -->
  <path class="accent-fill" d="M 742 480 Q 920 477 1098 482 Q 1101 525 1097 571 Q 920 574 743 570 Q 742 525 742 480 Z"/>
  <path class="ink-accent" d="M 742 480 Q 920 477 1098 482 Q 1101 525 1097 571 Q 920 574 743 570 Q 742 525 742 480 Z"/>
  <text class="label-hand" x="920" y="535" font-size="40">tool-grounded output</text>

  <!-- Right column vertical arrows (accent-coloured) -->
  <path class="ink-accent" d="M 920 223 Q 918 250 921 302"/>
  <path class="ink-accent" d="M 921 302 L 912 289"/>
  <path class="ink-accent" d="M 921 302 L 930 289"/>

  <path class="ink-accent" d="M 920 398 Q 918 425 921 477"/>
  <path class="ink-accent" d="M 921 477 L 912 464"/>
  <path class="ink-accent" d="M 921 477 L 930 464"/>

  <!-- ========= HORIZONTAL DASHED MAPPING ARROWS (one-to-one, subtle wobble) ========= -->
  <!-- Row 1 -->
  <path class="ink-dashed-muted" d="M 462 175 Q 600 172 740 176"/>
  <path class="ink" d="M 740 176 L 724 168" stroke="var(--muted)"/>
  <path class="ink" d="M 740 176 L 724 184" stroke="var(--muted)"/>

  <!-- Row 2 -->
  <path class="ink-dashed-muted" d="M 462 350 Q 600 347 740 351"/>
  <path class="ink" d="M 740 351 L 724 343" stroke="var(--muted)"/>
  <path class="ink" d="M 740 351 L 724 359" stroke="var(--muted)"/>

  <!-- Row 3 -->
  <path class="ink-dashed-muted" d="M 462 525 Q 600 522 740 526"/>
  <path class="ink" d="M 740 526 L 724 518" stroke="var(--muted)"/>
  <path class="ink" d="M 740 526 L 724 534" stroke="var(--muted)"/>

  <!-- Marginalia: small ink dot near left header -->
  <circle class="dot" cx="355" cy="72" r="2.6"/>
  <!-- Marginalia: tiny asterisk between columns near the middle row -->
  <path class="ink" d="M 600 348 L 600 358" stroke="var(--muted)"/>
  <path class="ink" d="M 595 351 L 605 355" stroke="var(--muted)"/>
  <path class="ink" d="M 605 351 L 595 355" stroke="var(--muted)"/>

  <!-- Caption -->
  <text class="caption-serif" x="600" y="640" font-size="26">same loop. same architecture.</text>
</svg>
