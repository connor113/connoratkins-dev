<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Tokens in, LLM, tokens out.">
  <title>Tokens in -> LLM -> Tokens out</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #555555;
      --accent: #0066CC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #ffffff;
        --muted: #bbbbbb;
        --accent: #0066CC;
      }
    }
    .bg { fill: var(--bg); }
    .box { fill: none; stroke: var(--fg); stroke-width: 3; }
    .box-accent { fill: none; stroke: var(--accent); stroke-width: 4; }
    .label { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: var(--fg); text-anchor: middle; }
    .label-accent { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: var(--accent); text-anchor: middle; }
    .sub { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: var(--muted); text-anchor: middle; }
    .arrow { stroke: var(--fg); stroke-width: 4; fill: none; }
    .arrow-head { fill: var(--fg); stroke: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="675"/>

  <!-- Input tokens box -->
  <rect class="box" x="60" y="237" width="300" height="200" rx="16" ry="16"/>
  <text class="label" x="210" y="330" font-size="40">Input</text>
  <text class="label" x="210" y="380" font-size="40">tokens</text>

  <!-- Arrow 1 -->
  <line class="arrow" x1="380" y1="337" x2="450" y2="337"/>
  <polygon class="arrow-head" points="450,325 478,337 450,349"/>

  <!-- LLM box (accent) -->
  <rect class="box-accent" x="478" y="237" width="244" height="200" rx="16" ry="16"/>
  <text class="label-accent" x="600" y="355" font-size="56">LLM</text>

  <!-- Arrow 2 -->
  <line class="arrow" x1="722" y1="337" x2="792" y2="337"/>
  <polygon class="arrow-head" points="792,325 820,337 792,349"/>

  <!-- Output tokens box -->
  <rect class="box" x="840" y="237" width="300" height="200" rx="16" ry="16"/>
  <text class="label" x="990" y="330" font-size="40">Output</text>
  <text class="label" x="990" y="380" font-size="40">tokens</text>

  <!-- Caption -->
  <text class="sub" x="600" y="560" font-size="28">Tokens in, tokens out.</text>
</svg>
