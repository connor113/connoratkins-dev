<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Hand-drawn diagram: a central LLM with seven satellite files around it — USER.md, SOUL.md, IDENTITY.md, AGENT.md, SKILLS.md, TOOLS.md, MEMORY.md.">
  <title>the harness: seven files, one folder, one model</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;family=Newsreader:ital,wght@0,400;1,400&amp;display=swap');
    :root {
      --bg: #FAF7F0;
      --fg: #1a1814;
      --muted: #7a7368;
      --accent: #0F4C81;
      --accent-fill: rgba(15, 76, 129, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a15;
        --fg: #eae6db;
        --muted: #8a8276;
        --accent: #6ba3d6;
        --accent-fill: rgba(107, 163, 214, 0.14);
      }
    }
    .bg { fill: var(--bg); }
    .ink {
      fill: none;
      stroke: var(--fg);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ink-thin {
      fill: none;
      stroke: var(--fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ink-accent {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .accent-fill { fill: var(--accent-fill); stroke: none; }
    .node-bg { fill: var(--bg); stroke: none; }
    .dot { fill: var(--fg); stroke: none; }
    .title-hand {
      font-family: 'Caveat', 'Comic Sans MS', 'Bradley Hand', cursive;
      font-weight: 700;
      fill: var(--fg);
      text-anchor: middle;
    }
    .label-hand {
      font-family: 'Caveat', 'Comic Sans MS', 'Bradley Hand', cursive;
      font-weight: 600;
      fill: var(--fg);
      text-anchor: middle;
    }
    .label-hand-accent {
      font-family: 'Caveat', 'Comic Sans MS', 'Bradley Hand', cursive;
      font-weight: 700;
      fill: var(--accent);
      text-anchor: middle;
    }
    .sub-serif {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      fill: var(--muted);
      text-anchor: middle;
    }
    .caption-serif {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      fill: var(--muted);
      text-anchor: middle;
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="675"/>

  <!-- Title -->
  <text class="title-hand" x="600" y="72" font-size="56">the harness</text>
  <!-- Tiny underline beneath title -->
  <path class="ink" d="M 498 88 Q 600 92 702 87"/>

  <!-- ========= EDGES (drawn first so nodes cover ends) ========= -->
  <!-- Central LLM node centre: (600, 360), approx half-width 92, half-height 68 -->

  <!-- Edge to IDENTITY.md (top, centre):  node centre (600, 175) -->
  <path class="ink" d="M 600 225 Q 598 260 601 293"/>
  <!-- arrowhead at LLM (pointing down) -->
  <path class="ink" d="M 601 293 L 592 280"/>
  <path class="ink" d="M 601 293 L 610 280"/>
  <!-- arrowhead at satellite (pointing up) -->
  <path class="ink" d="M 600 225 L 591 238"/>
  <path class="ink" d="M 600 225 L 609 238"/>

  <!-- Edge to USER.md (top-left): node centre (240, 175) -->
  <path class="ink" d="M 358 215 Q 432 250 510 300"/>
  <!-- arrowhead near LLM end -->
  <path class="ink" d="M 510 300 L 494 294"/>
  <path class="ink" d="M 510 300 L 501 287"/>
  <!-- arrowhead near USER end -->
  <path class="ink" d="M 358 215 L 374 221"/>
  <path class="ink" d="M 358 215 L 367 229"/>

  <!-- Edge to AGENT.md (top-right): node centre (960, 175) -->
  <path class="ink" d="M 842 215 Q 768 250 690 300"/>
  <!-- arrowhead near LLM end -->
  <path class="ink" d="M 690 300 L 706 294"/>
  <path class="ink" d="M 690 300 L 699 287"/>
  <!-- arrowhead near AGENT end -->
  <path class="ink" d="M 842 215 L 826 221"/>
  <path class="ink" d="M 842 215 L 833 229"/>

  <!-- Edge to SOUL.md (mid-left): node centre (155, 378) -->
  <path class="ink" d="M 275 378 Q 375 375 508 378"/>
  <!-- arrowhead near LLM end -->
  <path class="ink" d="M 508 378 L 492 370"/>
  <path class="ink" d="M 508 378 L 492 386"/>
  <!-- arrowhead near SOUL end -->
  <path class="ink" d="M 275 378 L 291 370"/>
  <path class="ink" d="M 275 378 L 291 386"/>

  <!-- Edge to SKILLS.md (mid-right): node centre (1045, 378) -->
  <path class="ink" d="M 925 378 Q 825 381 692 378"/>
  <!-- arrowhead near LLM end -->
  <path class="ink" d="M 692 378 L 708 370"/>
  <path class="ink" d="M 692 378 L 708 386"/>
  <!-- arrowhead near SKILLS end -->
  <path class="ink" d="M 925 378 L 909 370"/>
  <path class="ink" d="M 925 378 L 909 386"/>

  <!-- Edge to TOOLS.md (bot-left): node centre (340, 545). Line goes from
       just outside LLM bottom-left corner to just above the TOOLS top edge. -->
  <path class="ink" d="M 500 432 Q 450 472 390 502"/>
  <!-- arrowhead near LLM end (pointing up-right toward LLM) -->
  <path class="ink" d="M 500 432 L 484 435"/>
  <path class="ink" d="M 500 432 L 492 447"/>
  <!-- arrowhead near TOOLS end (pointing down-left toward TOOLS) -->
  <path class="ink" d="M 390 502 L 400 487"/>
  <path class="ink" d="M 390 502 L 406 496"/>

  <!-- Edge to MEMORY.md (bot-right): node centre (860, 545) -->
  <path class="ink" d="M 700 432 Q 750 472 810 502"/>
  <!-- arrowhead near LLM end -->
  <path class="ink" d="M 700 432 L 716 435"/>
  <path class="ink" d="M 700 432 L 708 447"/>
  <!-- arrowhead near MEMORY end -->
  <path class="ink" d="M 810 502 L 800 487"/>
  <path class="ink" d="M 810 502 L 794 496"/>

  <!-- ========= CENTRAL LLM NODE ========= -->
  <!-- Filled rectangle with wobbly edges, centre (600, 360), ~184 x 138 -->
  <path class="node-bg" d="
    M 510 295
    Q 600 292 693 296
    Q 695 360 691 428
    Q 600 431 509 427
    Q 510 360 510 295
    Z"/>
  <path class="accent-fill" d="
    M 510 295
    Q 600 292 693 296
    Q 695 360 691 428
    Q 600 431 509 427
    Q 510 360 510 295
    Z"/>
  <path class="ink-accent" d="
    M 510 295
    Q 600 292 693 296
    Q 695 360 691 428
    Q 600 431 509 427
    Q 510 360 510 295
    Z"/>
  <text class="label-hand-accent" x="601" y="378" font-size="60">LLM</text>

  <!-- ========= SATELLITE NODES ========= -->
  <!-- Each: background fill to cover edge stubs, then wobbly path outline, then labels. -->

  <!-- Satellite dimensions: ~ w=220, h=84 -->

  <!-- USER.md (top-left), centre (240, 175) -->
  <path class="node-bg" d="M 130 135 Q 240 132 350 136 Q 352 175 349 215 Q 240 218 131 214 Q 130 175 130 135 Z"/>
  <path class="ink" d="M 130 135 Q 240 132 350 136 Q 352 175 349 215 Q 240 218 131 214 Q 130 175 130 135 Z"/>
  <text class="label-hand" x="240" y="172" font-size="34">USER.md</text>
  <text class="sub-serif" x="240" y="199" font-size="16">who the user is</text>

  <!-- IDENTITY.md (top-centre), centre (600, 175) -->
  <path class="node-bg" d="M 490 135 Q 600 132 710 136 Q 712 175 709 215 Q 600 218 491 214 Q 490 175 490 135 Z"/>
  <path class="ink" d="M 490 135 Q 600 132 710 136 Q 712 175 709 215 Q 600 218 491 214 Q 490 175 490 135 Z"/>
  <text class="label-hand" x="600" y="172" font-size="34">IDENTITY.md</text>
  <text class="sub-serif" x="600" y="199" font-size="16">name, role, voice</text>

  <!-- AGENT.md (top-right), centre (960, 175) -->
  <path class="node-bg" d="M 850 135 Q 960 132 1070 136 Q 1072 175 1069 215 Q 960 218 851 214 Q 850 175 850 135 Z"/>
  <path class="ink" d="M 850 135 Q 960 132 1070 136 Q 1072 175 1069 215 Q 960 218 851 214 Q 850 175 850 135 Z"/>
  <text class="label-hand" x="960" y="172" font-size="34">AGENT.md</text>
  <text class="sub-serif" x="960" y="199" font-size="16">operating rules</text>

  <!-- SOUL.md (mid-left), centre (155, 378) -->
  <path class="node-bg" d="M 45 338 Q 155 335 265 339 Q 267 378 264 418 Q 155 421 46 417 Q 45 378 45 338 Z"/>
  <path class="ink" d="M 45 338 Q 155 335 265 339 Q 267 378 264 418 Q 155 421 46 417 Q 45 378 45 338 Z"/>
  <text class="label-hand" x="155" y="375" font-size="34">SOUL.md</text>
  <text class="sub-serif" x="155" y="402" font-size="16">stance and boundaries</text>

  <!-- SKILLS.md (mid-right), centre (1045, 378) -->
  <path class="node-bg" d="M 935 338 Q 1045 335 1155 339 Q 1157 378 1154 418 Q 1045 421 936 417 Q 935 378 935 338 Z"/>
  <path class="ink" d="M 935 338 Q 1045 335 1155 339 Q 1157 378 1154 418 Q 1045 421 936 417 Q 935 378 935 338 Z"/>
  <text class="label-hand" x="1045" y="375" font-size="34">SKILLS.md</text>
  <text class="sub-serif" x="1045" y="402" font-size="16">what it can do</text>

  <!-- TOOLS.md (bot-left), centre (340, 545) -->
  <path class="node-bg" d="M 230 505 Q 340 502 450 506 Q 452 545 449 585 Q 340 588 231 584 Q 230 545 230 505 Z"/>
  <path class="ink" d="M 230 505 Q 340 502 450 506 Q 452 545 449 585 Q 340 588 231 584 Q 230 545 230 505 Z"/>
  <text class="label-hand" x="340" y="542" font-size="34">TOOLS.md</text>
  <text class="sub-serif" x="340" y="569" font-size="16">what it can reach</text>

  <!-- MEMORY.md (bot-right), centre (860, 545) -->
  <path class="node-bg" d="M 750 505 Q 860 502 970 506 Q 972 545 969 585 Q 860 588 751 584 Q 750 545 750 505 Z"/>
  <path class="ink" d="M 750 505 Q 860 502 970 506 Q 972 545 969 585 Q 860 588 751 584 Q 750 545 750 505 Z"/>
  <text class="label-hand" x="860" y="542" font-size="34">MEMORY.md</text>
  <text class="sub-serif" x="860" y="569" font-size="16">what it remembers</text>

  <!-- Marginalia: small ink dot just right of the title -->
  <circle class="dot" cx="722" cy="54" r="2.6"/>

  <!-- Marginalia: a tiny asterisk in the top-right gap between IDENTITY and AGENT -->
  <path class="ink-thin" d="M 790 70 L 790 80"/>
  <path class="ink-thin" d="M 785 73 L 795 77"/>
  <path class="ink-thin" d="M 795 73 L 785 77"/>

  <!-- Caption -->
  <text class="caption-serif" x="600" y="645" font-size="24">seven files, one folder, one model.</text>
</svg>
