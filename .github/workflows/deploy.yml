name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt every JavaScript action in this workflow to Node.js 24. GitHub forces
# Node 24 by default from 2026-06-02 and removes Node 20 entirely on
# 2026-09-16. Setting this now surfaces any incompatibility early instead of
# the morning the runner flips. Remove this env once withastro/action and the
# bundled actions ship Node 24-native major versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload
        uses: withastro/action@v4
        # Uncomment and adjust if this site is ever nested in a subfolder:
        # with:
        #   path: .
        #   node-version: 22
        #   package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
